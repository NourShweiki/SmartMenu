name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package.json

      # Node 22 ships npm 10, but our machines use npm 11. npm 10 rejects lock files written by
      # npm 11 ("Missing: @swc/helpers from lock file"); npm 11 accepts lock files from both.
      - name: Use npm 11
        run: npm install -g npm@11 && npm -v

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (incl. architecture import rules)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
