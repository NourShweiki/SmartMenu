name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every area of the app (test-groups.json) is its own check, so a red check names what broke:
#   "Unit - Orders & takeout", "Database - Orders & takeout", "Typecheck", "Lint & architecture rules", ...
# The two jobs at the bottom, "check" and "database", only collect those results: they are the checks the
# ruleset on main requires, so their names must not change.
jobs:
  groups:
    name: Test groups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unit: ${{ steps.areas.outputs.unit }}
      database: ${{ steps.areas.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails when a test file is in no area (it would never run in CI) or in two.
      - name: Every test belongs to exactly one area
        id: areas
        run: node scripts/check-test-groups.mjs --matrix

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  lint:
    name: Lint & architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build

  unit:
    name: Unit - ${{ matrix.area.name }}
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # one broken area must not hide the state of the others
      matrix:
        area: ${{ fromJSON(needs.groups.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests (${{ matrix.area.id }})
        run: npx vitest run --project ${{ matrix.area.id }}

  # The database rules (tenant isolation, roles, privileges) and the real Supabase adapters, per area. Each job runs
  # a local Supabase in Docker on the runner, built from supabase/migrations + supabase/seed.sql.
  db:
    name: Database - ${{ matrix.area.name }}
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.groups.outputs.database) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      # Only what the tests use: database, auth, REST API, storage and the gateway in front of them.
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,analytics,vector,realtime,meta

      # `npm run test:integration` reads .env.local, so write one from the running Supabase (local keys, not secrets).
      - name: Write .env.local for the integration tests
        run: |
          eval "$(supabase status -o env)"
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY" && test -n "$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "APP_ROOT_DOMAIN=localhost"
          } > .env.local

      - name: Database tests (pgTAP)
        if: matrix.area.files != ''
        run: supabase test db ${{ matrix.area.files }}

      # REQUIRE_SUPABASE=1: a missing setting fails the run instead of silently skipping the integration tests.
      - name: Integration tests (real Supabase adapters)
        if: success() || failure() # also when pgTAP failed, so both results are visible
        run: npm run test:integration -- --project ${{ matrix.area.id }}
        env:
          REQUIRE_SUPABASE: "1"

  # ── Gates required by the ruleset on main: red when any job they collect is not green (also when skipped). ──
  check:
    name: check
    needs: [groups, typecheck, lint, build, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All code checks and unit test areas passed
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  database:
    name: database
    needs: [groups, db]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All database test areas passed
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
